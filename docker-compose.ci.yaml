services:
  test-db:
    image: postgres:16-alpine
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_USER_FILE=/run/secrets/test-db-user
      - POSTGRES_PASSWORD_FILE=/run/secrets/test-db-password
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test
    secrets:
      - test-db-user
      - test-db-password
    user: ${DOCKER_USER}
